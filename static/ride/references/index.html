<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景与物体参考照片 · 张开渊</title><style>
:root{--paper:#f7f6f1;--ink:#252c30;--orange:#b83d12;--line:#dcded6;--muted:#686d66;--white:#fff;--body:system-ui,sans-serif}*{box-sizing:border-box}html,body{overflow-x:clip;margin:0;background:var(--paper);color:var(--ink);font:15px/1.8 var(--body)}main{max-width:1100px;margin:auto;padding:50px 25px}a{color:var(--orange)}h1{font-weight:450;overflow-wrap:anywhere;min-width:0}h2{overflow-wrap:anywhere;min-width:0;margin:0 0 10px;font-weight:450}header{padding-bottom:40px;border-bottom:1px solid var(--line)}section{padding:40px 0;border-bottom:1px solid var(--line)}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}figure{margin:0}img{width:100%;height:320px;object-fit:contain;display:block;background:var(--white)}figcaption{font-size:12px;padding-top:12px}strong,small{display:block}small{color:var(--muted)}p{max-width:850px;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px}button{font:inherit}footer{font-size:11px;padding:30px 0;color:var(--muted)}@media(max-width:650px){.photos{grid-template-columns:minmax(0,1fr)}img{height:auto;max-height:420px}main{padding:24px 18px}}
</style></head><body><main><header><a href="/journey/">← 返回骑行场景</a><h1>照片、物体与场景</h1><p>每一站使用的实际参考资料。建筑和展位按照片重建；Galbot G1 直接使用官方开源机械模型。参考照片不会被当作个人经历的实拍证明。</p><nav id="links"></nav></header><div id="references"></div><footer>犀浦西门照片：Kcx36 / CC BY-SA 4.0；武汉二中照片：MarkZhou08 / CC BY-SA 4.0，文件未修改；页面缩放展示。其余照片保留原来源署名，作为本地设计参考。Galbot 三维资产：GalaxyGeneralRobotics / Apache-2.0。<a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · <a href="../models/galbot/LICENSE">模型许可证</a></footer></main><script type="module">
import{stations,photoPath,displayPath}from'../stations.js?v=cine6';const root=document.querySelector('#references');for(const st of stations){const link=document.createElement('a');link.href='#'+st.id;link.textContent=st.title;document.querySelector('#links').append(link);const section=document.createElement('section');section.id=st.id;const h=document.createElement('h2');h.textContent=st.title;section.append(h);const photos=document.createElement('div');photos.className='photos';for(const p of st.photos){const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img');a.href=photoPath(p.file);img.src=displayPath(p.file);img.alt=p.title;img.loading='lazy';a.append(img);const caption=document.createElement('figcaption'),title=document.createElement('strong'),credit=document.createElement('small'),features=document.createElement('p'),source=document.createElement('a');title.textContent=p.title;credit.textContent=p.credit;features.textContent=p.features;source.href=p.url;source.textContent=p.source+' ↗';caption.append(title,credit,features,source);f.append(a,caption);photos.append(f)}section.append(photos);root.append(section)}
</script></body></html>
